    <path d="M128 32C128 32 76 80 76 136C76 192 128 200 128 200C128 200 180 192 180 136C180 80 128 32 128 32Z" fill="url(#leafGrad)" />
    <path d="M128 90C128 90 96 120 96 150C96 180 128 185 128 185C128 185 160 180 160 150C160 120 128 90 128 90Z" fill="#ffffff" opacity="0.25" />
    
    <!-- Secondary leaves -->
    <path d="M128 160C128 160 170 120 200 120C230 120 220 160 220 160C220 160 180 170 128 160Z" fill="#2e7d32" />
    <path d="M128 160C128 160 86 120 56 120C26 120 36 160 36 160C36 160 76 170 128 160Z" fill="#0d631b" />
    
    <!-- Stem -->
    <path d="M128 200V240" stroke="url(#leafGrad)" stroke-width="16" stroke-linecap="round" />
  </g>
</svg>
