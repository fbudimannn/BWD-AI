<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#88d982" />
      <stop offset="50%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#0d631b" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#f7f9fb" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="#ffffff" stroke="#e0e3e5" stroke-width="8" />
  
  <!-- Circle Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#leafGrad)" opacity="0.1" />
  
  <!-- Plant Icon (Phosphor plant style) -->
  <g transform="translate(128, 128) scale(1.0)">
